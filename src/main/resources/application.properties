spring.application.name=ansimlife
server.forward-headers-strategy=framework
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:ansimlife;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=false
spring.jackson.default-property-inclusion=non_null
server.servlet.session.timeout=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
ansimlife.public-data.service-key=${DATA_GO_KR_SERVICE_KEY:}
